    enabled: true
    managedCertificateName: rapidpro-tls




##Test de gcs con service account
# 1. Montar el volumen usando el nombre dinámico del Secret creado por Helm
volumes:
  - name: gcs-key
    secret:
      # Si tu release de helm se llama "rapidpro-prod", el secret se llamará "rapidpro-prod-gcs-credentials"
      secretName: rapidpro-gcs-credentials


volumeMounts:
  - name: gcs-key
    mountPath: /var/secrets/google
    readOnly: true


# 2. Configuración del backend de Google Cloud para Django
extraEnv:
  - name: DJANGO_STORAGE_BACKEND
    value: "storages.backends.gcloud.GoogleCloudStorage"
 
  - name: GS_BUCKET_NAME
    value: "tu-bucket-rapidpro-static" # El bucket de tus estáticos
 
  - name: GOOGLE_APPLICATION_CREDENTIALS
    value: "/var/secrets/google/gcs-sa.json" # Ruta del archivo montado
   
  - name: GS_DEFAULT_ACL
    value: "publicRead"
  - name: GS_QUERYSTRING_AUTH
    value: "False"
