  courierAuthToken: "xt8QmPmfHpPaEyQYWGEMdoP3qFRDCZL4k4T9Ya4TeXWfuQa7ojk2AfJLBWT3Yu8F"


# Recursos
resources:
  rapidpro:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  celery:
    requests:
      cpu: "250m"      # idle real ~5-21m; sobra, pero amortigua el HPA (no escala por picos de boot)
      memory: "512Mi"  # uso real medido ~440-566Mi (antes 384Mi quedaba corto)
    limits:
      cpu: "1"         # permite ráfagas al procesar flows/mensajes
      memory: "1Gi"    # evita OOMKill: celery usa ~500Mi (con 512Mi se moría)
  default:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"






