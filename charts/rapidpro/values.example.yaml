# Configuración general
replicaCount:
  rapidpro: 1
  celery: 1
  courier: 1
  mailroom: 1
  indexer: 1


# Autoescalado horizontal (HPA nativo, basado en CPU).
# minReplicas se deja en 1; maxReplicas holgado para picos de demanda.
# El escalado por longitud de cola (courier/celery) requiere KEDA -> fase 2.
autoscaling:
  rapidpro:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  celery:
    enabled: true
    minReplicas: 1
    maxReplicas: 15
    targetCPUUtilizationPercentage: 75
  courier:
    enabled: true
    minReplicas: 1
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
  mailroom:
    enabled: true
    minReplicas: 1
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70




# Imágenes
images:
  rapidpro:
    repository: us-central1-docker.pkg.dev/mgcp-10078073-nono-card-dev/nonodev-rapidpro/rapidpro
    tag: nonoBranch
    pullPolicy: Always


  mailroom:
    repository: us-central1-docker.pkg.dev/mgcp-10078073-nono-card-dev/nonodev-rapidpro/mailroom
    tag: v26.2.0
    pullPolicy: Always


  courier:
    repository: us-central1-docker.pkg.dev/mgcp-10078073-nono-card-dev/nonodev-rapidpro/courier
