{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rapidpro.fullname" . }}-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
  labels:
    {{- include "rapidpro.labels" . | nindent 4 }}

spec:
  ingressClassName: {{ .Values.ingress.className }}   # Use 'gce'
  rules:
    - host: {{ .Values.ingress.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rapidpro.fullname" . }}-rapidpro
                port:
                  number: 8000

          - path: /mr/
            pathType: Prefix
            backend:
              service:
                name: {{ include "rapidpro.fullname" . }}-mailroom
                port:
                  number: 8090

          - path: /c/
            pathType: Prefix
            backend:
              service:
                name: {{ include "rapidpro.fullname" . }}-courier
                port:
                  number: 8080
{{- end }}