apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rapidpro.fullname" . }}-indexer
  labels:
    {{- include "rapidpro.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.indexer }}
  selector:
    matchLabels:
      {{- include "rapidpro.selectorLabels" . | nindent 6 }}
      component: indexer
  template:
    metadata:
      labels:
        {{- include "rapidpro.selectorLabels" . | nindent 8 }}
        component: indexer
    spec:
      containers:
        - name: indexer
          image: "{{ .Values.images.indexer.repository }}:{{ .Values.images.indexer.tag }}"
          imagePullPolicy: {{ .Values.images.indexer.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "rapidpro.fullname" . }}-config
            - configMapRef:
                name: {{ include "rapidpro.fullname" . }}-indexer-config
            - secretRef:
                name: {{ include "rapidpro.fullname" . }}-secrets
          env:
            - name: INDEXER_DB
              value: "postgres://{{ .Values.database.user }}:{{ .Values.secrets.dbPassword }}@127.0.0.1:5432/{{ .Values.database.name }}?sslmode=disable"
            - name: INDEXER_ELASTIC_URL
              value: "http://{{ .Values.elastic.host }}:{{ .Values.elastic.port }}"
          resources:
            {{- toYaml .Values.resources.default | nindent 12 }}
        
        - name: cloudsql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:latest
          command:
            - "/cloud_sql_proxy"
            - "-instances={{ .Values.cloudsql.instanceConnectionName }}=tcp:5432"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
