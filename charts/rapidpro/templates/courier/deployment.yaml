apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rapidpro.fullname" . }}-courier
  labels:
    {{- include "rapidpro.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.courier }}
  selector:
    matchLabels:
      {{- include "rapidpro.selectorLabels" . | nindent 6 }}
      component: courier
  template:
    metadata:
      labels:
        {{- include "rapidpro.selectorLabels" . | nindent 8 }}
        component: courier
    spec:
      containers:
        - name: courier
          image: "{{ .Values.images.courier.repository }}:{{ .Values.images.courier.tag }}"
          imagePullPolicy: {{ .Values.images.courier.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "rapidpro.fullname" . }}-config
            - configMapRef:
                name: {{ include "rapidpro.fullname" . }}-courier-config
            - secretRef:
                name: {{ include "rapidpro.fullname" . }}-secrets
          env:
            - name: COURIER_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rapidpro.fullname" . }}-config
                  key: DATABASE_URL
            - name: COURIER_VALKEY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rapidpro.fullname" . }}-config
                  key: VALKEY_URL
            - name: COURIER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rapidpro.fullname" . }}-secrets
                  key: COURIER_AUTH_TOKEN
            - name: COURIER_AWS_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rapidpro.fullname" . }}-config
                  key: AWS_ACCESS_KEY_ID
            - name: COURIER_AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rapidpro.fullname" . }}-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: COURIER_DYNAMO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rapidpro.fullname" . }}-config
                  key: DYNAMO_ENDPOINT
            - name: COURIER_DYNAMO_TABLE_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rapidpro.fullname" . }}-config
                  key: DYNAMO_TABLE_PREFIX
            - name: COURIER_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rapidpro.fullname" . }}-config
                  key: S3_ENDPOINT
            - name: COURIER_S3_ATTACHMENTS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rapidpro.fullname" . }}-config
                  key: S3_ATTACHMENTS_BUCKET
            - name: COURIER_S3_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rapidpro.fullname" . }}-config
                  key: S3_PATH_STYLE
          resources:
            {{- toYaml .Values.resources.default | nindent 12 }}
        
        - name: cloudsql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:latest
          command:
            - "/cloud_sql_proxy"
            - "-instances={{ .Values.cloudsql.instanceConnectionName }}=tcp:5432"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
