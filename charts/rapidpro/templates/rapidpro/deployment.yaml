apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rapidpro.fullname" . }}-rapidpro
  labels:
    {{- include "rapidpro.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.rapidpro }}
  selector:
    matchLabels:
      {{- include "rapidpro.selectorLabels" . | nindent 6 }}
      component: rapidpro
  template:
    metadata:
      labels:
        {{- include "rapidpro.selectorLabels" . | nindent 8 }}
        component: rapidpro
    spec:
      containers:
        - name: rapidpro
          image: "{{ .Values.images.rapidpro.repository }}:{{ .Values.images.rapidpro.tag }}"
          imagePullPolicy: {{ .Values.images.rapidpro.pullPolicy }}
          args:
            - webapp
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "rapidpro.fullname" . }}-config
            - configMapRef:
                name: {{ include "rapidpro.fullname" . }}-rapidpro-config
            - secretRef:
                name: {{ include "rapidpro.fullname" . }}-secrets
          env:
            - name: DYNAMO_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rapidpro.fullname" . }}-config
                  key: DYNAMO_ENDPOINT
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rapidpro.fullname" . }}-secrets
                  key: DB_PASSWORD
          resources:
            {{- toYaml .Values.resources.rapidpro | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /msg
              port: 8000
            initialDelaySeconds: 180
            timeoutSeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /msg
              port: 8000
            initialDelaySeconds: 180
            timeoutSeconds: 60
            periodSeconds: 15
            failureThreshold: 6
        
        - name: cloudsql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:latest
          command:
            - "/cloud_sql_proxy"
            - "-instances={{ .Values.cloudsql.instanceConnectionName }}=tcp:5432"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
