{{- if .Values.autoscaling.rapidpro.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rapidpro.fullname" . }}-rapidpro
  labels:
    {{- include "rapidpro.labels" . | nindent 4 }}
    component: rapidpro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rapidpro.fullname" . }}-rapidpro
  minReplicas: {{ .Values.autoscaling.rapidpro.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.rapidpro.maxReplicas }}
  metrics:
    # ContainerResource apunta al contenedor de la app (no al sidecar
    # cloudsql-proxy) para que la CPU no se diluya. Estable desde K8s 1.27.
    - type: ContainerResource
      containerResource:
        name: cpu
        container: rapidpro
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.rapidpro.targetCPUUtilizationPercentage }}
{{- end }}
