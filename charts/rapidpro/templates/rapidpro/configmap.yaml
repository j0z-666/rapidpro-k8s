apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rapidpro.fullname" . }}-rapidpro-config
  labels:
    {{- include "rapidpro.labels" . | nindent 4 }}
data:
  MAILROOM_URL: "http://{{ include "rapidpro.fullname" . }}-mailroom:8090"
  CELERY_BROKER_URL: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/{{ .Values.redis.db }}"
  MAILROOM_AUTH_TOKEN: {{ .Values.tokens.mailroomAuthToken | quote }}
  EMAIL_HOST_USER: {{ .Values.email.fromEmail | quote }}
  EMAIL_HOST_PASSWORD: {{ .Values.secrets.emailPassword | quote }}
  EMAIL_HOST: {{ .Values.email.host | quote }}
  EMAIL_PORT: {{ .Values.email.port | quote }}
  EMAIL_USE_TLS: {{ .Values.email.useTLS | quote }}
  EMAIL_USE_SSL: {{ .Values.email.useSSL | quote }}
  DEFAULT_FROM_EMAIL: {{ .Values.email.fromEmail | quote }}
  FLOW_FROM_EMAIL: {{ .Values.email.fromEmail | quote }}
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  POSTGRES_HOST: "127.0.0.1"
  POSTGRES_PORT: {{ .Values.database.port | quote }}
