{{- if .Values.autoscaling.mailroom.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rapidpro.fullname" . }}-mailroom
  labels:
    {{- include "rapidpro.labels" . | nindent 4 }}
    component: mailroom
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rapidpro.fullname" . }}-mailroom
  minReplicas: {{ .Values.autoscaling.mailroom.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.mailroom.maxReplicas }}
  metrics:
    # ContainerResource apunta al contenedor de la app (no al sidecar
    # cloudsql-proxy) para que la CPU no se diluya. Estable desde K8s 1.27.
    - type: ContainerResource
      containerResource:
        name: cpu
        container: mailroom
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.mailroom.targetCPUUtilizationPercentage }}
{{- end }}
