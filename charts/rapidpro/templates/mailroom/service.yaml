apiVersion: v1
kind: Service
metadata:
  name: {{ include "rapidpro.fullname" . }}-mailroom
  labels:
    {{- include "rapidpro.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/backend-config: '{"default": "{{ include "rapidpro.fullname" . }}-mailroom-backendconfig"}'
spec:
  type: NodePort
  ports:
    - name: public
      port: 8090
      targetPort: public
    - name: internal
      port: 8091
      targetPort: internal
  selector:
    {{- include "rapidpro.selectorLabels" . | nindent 4 }}
    component: mailroom
